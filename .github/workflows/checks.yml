name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        widgets: ['7.7.1', '8.1.9']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt -r requirements-web-dev.txt "ipywidgets==${{ matrix.widgets }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/web/*.test.mjs
      - run: ruff check .
      - run: python scripts/build_notebook.py --check
      - run: python scripts/build_sequential_notebook.py --check
      - run: python scripts/build_multitask_notebook.py --check
      - run: python scripts/check_healthcare_evidence.py
      - run: pytest -q
